<script>
  (function () {
    var currentBuildVersion = document.querySelector('meta[name="build-version"]') && document.querySelector('meta[name="build-version"]').content;
    var checkInFlight = false;
    var reloadRequested = false;

    function checkTapeoutBuild() {
      if (document.visibilityState !== 'visible' || checkInFlight || reloadRequested) return;
      checkInFlight = true;

      fetch('?vcheck=' + Date.now(), { cache: 'no-store' }).then(function (response) {
        return response.text();
      }).then(function (html) {
        var fetchedDocument = new DOMParser().parseFromString(html, 'text/html');
        var meta = fetchedDocument.querySelector('meta[name="build-version"]');
        var fetchedBuildVersion = meta && meta.content;

        var lastReloaded = window.history.state && window.history.state.tapeoutReloadedBuildVersion;
        if (fetchedBuildVersion && fetchedBuildVersion !== currentBuildVersion && fetchedBuildVersion !== lastReloaded) {
          reloadRequested = true;
          var state = window.history.state || {};
          state.tapeoutReloadedBuildVersion = fetchedBuildVersion;
          window.history.replaceState(state, '');
          window.location.reload();
        }
      }).catch(function () {
        // A failed background check should not interrupt the page.
      }).then(function () {
        checkInFlight = false;
      });
    }

    document.addEventListener('visibilitychange', checkTapeoutBuild);
    // A fresh launch may never fire visibilitychange, so check once shortly
    // after load as well.
    setTimeout(checkTapeoutBuild, 2500);
  })();
</script>
<script>
  if ('serviceWorker' in navigator) {

        if (document.visibilityState === 'visible') reg.update();

      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
