<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#090a0a">
<meta name="robots" content="noindex">
<title>404: No Such Page | TAPEOUT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#090a0a;--ink:#f2f0ea;--muted:#9b9d98;--signal:#ff6b19;--line:#313331}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--void);color:var(--ink)}
body{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(2rem,8vw,6rem);font-family:"IBM Plex Mono",ui-monospace,monospace;max-width:56rem}
.brand{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:600;letter-spacing:.12em;font-size:1rem;color:var(--signal);text-transform:uppercase;margin-bottom:1.5rem}
h1{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;font-size:clamp(3rem,12vw,7rem);line-height:.95;letter-spacing:.03em;margin-bottom:1.5rem}
p{color:var(--muted);font-size:1rem;line-height:1.7;max-width:34rem;margin-bottom:2.5rem}
a.back{display:inline-block;font-family:"IBM Plex Mono",monospace;color:var(--void);background:var(--signal);text-decoration:none;font-weight:500;padding:.9rem 1.75rem;border-radius:2px}
a.back:hover{background:var(--ink)}
footer{margin-top:4rem;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1.5rem;width:100%}
footer a,footer button{color:var(--muted)}
.contact-choices button{background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="brand">TAPEOUT</div>
<h1>404</h1>
<p>No such page. Nothing ships from here.</p>
<a class="back" href="https://dillingerstaffing.github.io/tapeout/">Back to TAPEOUT</a>
<footer>Need a quote? <span class="contact-choices" role="group" aria-label="Contact options"><a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=shipthisgroup%40gmail.com&amp;su=Quote%20request" target="_blank" rel="noopener noreferrer">Open in Gmail</a> / <a href="mailto:shipthisgroup@gmail.com?subject=Quote%20request">Email app</a> / <button type="button" id="copyAddr">Copy address</button><span class="copy-status" id="copyStatus" role="status" aria-live="polite"></span></span></footer>
<script>
(function(){var b=document.getElementById('copyAddr'),s=document.getElementById('copyStatus');if(!b)return;function say(m){s.textContent=m;}function legacy(){var t=document.createElement('textarea');t.value='shipthisgroup@gmail.com';document.body.appendChild(t);t.select();try{document.execCommand('copy');say('Copied');}catch(e){say('Copy failed');}document.body.removeChild(t);}b.addEventListener('click',function(){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText('shipthisgroup@gmail.com').then(function(){say('Copied');},legacy);}else{legacy();}});})();
</script>
</body>
</html>
